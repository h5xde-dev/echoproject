# evntary.ru — North Echo. Static site from the last build, the game server
# (127.0.0.1:8090) for login, API, rating page and the ranked WebSocket.
# UDP for ranked matches (WebRTC, ports 40000-40199) goes to the game server
# directly, not through nginx.

server {
    listen 80;
    listen [::]:80;
    server_name evntary.ru www.evntary.ru;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://evntary.ru$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.evntary.ru;
    ssl_certificate /etc/letsencrypt/live/evntary.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evntary.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://evntary.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evntary.ru;
    ssl_certificate /etc/letsencrypt/live/evntary.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evntary.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/northecho/dist;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/octet-stream text/plain application/xml;
    gzip_min_length 1024;

    location = /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    location ~ ^/(api|auth)/|^/callback$|^/rating/?$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bundles and game assets: cache for a day (models keep their names).
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /play { add_header Cache-Control "no-cache"; try_files /play.html =404; }
    location / { try_files $uri $uri.html =404; }
}
