# evntary.ru — North Echo. The site is the live release's build
# (current/ -> releases/<sha>, switched atomically by deploy.sh); behind it:
#   API  127.0.0.1:8090  login, account, rating page and table
#   meta 127.0.0.1:8091  rooms, ranked queue (WebSocket /meta)
#   game 127.0.0.1:8092  matches (WebSocket /game)
# UDP for the matches' fast path (WebRTC, ports 40000-40199) goes to the game
# server directly, not through nginx. /internal/* and /healthz are not exposed.

server {
    listen 80;
    listen [::]:80;
    server_name evntary.ru www.evntary.ru;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://evntary.ru$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.evntary.ru;
    ssl_certificate /etc/letsencrypt/live/evntary.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evntary.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://evntary.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evntary.ru;
    ssl_certificate /etc/letsencrypt/live/evntary.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evntary.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/northecho/current/apps/web/dist;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/octet-stream text/plain application/xml;
    gzip_min_length 1024;

    location = /meta {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location = /game {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    location = /meta/status {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
    }

    location ~ ^/(api|auth)/|^/callback$|^/rating/?$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /internal/ { return 404; }

    # Hashed bundles never change: cache them for long. Models keep their names: a day.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /play { add_header Cache-Control "no-cache"; try_files /play.html =404; }
    location / { try_files $uri $uri.html =404; }
}
